name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build signed APK
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: tv-remote-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Publish as a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk tv-remote.apk
          gh release create "build-${{ github.run_number }}" tv-remote.apk \
            --title "TV Remote build ${{ github.run_number }}" \
            --notes "Automated build from ${{ github.sha }}"
